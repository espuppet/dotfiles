# ~/.tmux.conf
# Cleaned-up config with catppuccin latte status line.
# Requires: tmux >= 3.2, a Nerd Font.

# ── General ─────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g visual-activity on
setw -g monitor-activity on
setw -g automatic-rename off
setw -g mode-keys vi
set -g status-keys vi
set -g history-limit 100000
set -g extended-keys on
set -g display-time 5000

# ── Prefix ──────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Splits ──────────────────────────────────────────────
unbind '"'
bind - splitw -v
unbind %
bind | splitw -h

# ── Pane navigation ─────────────────────────────────────
bind k selectp -U
bind j selectp -D
bind h selectp -L
bind l selectp -R

# ── Reload ──────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ── Copy mode (vi) ─────────────────────────────────────
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# ── Catppuccin (Latte) ──────────────────────────────────
set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# Load catppuccin (module overrides must come after this)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ── Status bar ──────────────────────────────────────────
set -g status-interval 2
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 140

set -gF status-left "#{E:@catppuccin_status_session}"

set -g status-right ""
# git branch (current pane)
set -ag status-right "#[fg=#{@thm_teal},bg=default]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_teal}]󰊢 #[fg=#{@thm_fg},bg=#{@thm_surface_0}]#(~/.config/tmux/scripts/git_status.sh \"#{pane_current_path}\")#[fg=#{@thm_surface_0},bg=default]#{@catppuccin_status_right_separator}"
# cpu
set -ag status-right "#[fg=#{@thm_yellow},bg=default]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{cpu_fg_color},bg=#{cpu_bg_color}] #{cpu_percentage}#[fg=#{cpu_bg_color},bg=default]#{@catppuccin_status_right_separator}"
# ram
set -ag status-right "#[fg=#{@thm_yellow},bg=default]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{ram_fg_color},bg=#{ram_bg_color}] #{ram_percentage}#[fg=#{ram_bg_color},bg=default]#{@catppuccin_status_right_separator}"
# date / time
set -ag status-right "#[fg=#{@thm_sapphire},bg=default]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_sapphire}]󰃰 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] %Y-%m-%d %H:%M#[fg=#{@thm_surface_0},bg=default]#{@catppuccin_status_right_separator}"

# CPU / RAM plugin (must run after catppuccin and status-right)
run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
set -g extended-keys-format csi-u
